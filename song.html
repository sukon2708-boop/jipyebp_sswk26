<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Song</title>

  <!-- FONT -->
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }


    /* =========================
       BODY
    ========================== */

    body {
      font-family: "Prompt", sans-serif;

      background:
        url("bg.png")
        center center /
        cover
        no-repeat;

      display: flex;

      justify-content: center;
      align-items: center;

      position: relative;
    }


    /* =========================
       MAIN CONTAINER
    ========================== */

    .song-container {

      position: relative;

      width: min(435px, 100vw);

      height: min(700px, 100vh);

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      padding:
        75px 15px
        85px;
    }


    /* =====================================================
       SONG TITLE IMAGE
    ===================================================== */

    .song-title {

      position: absolute;

      top:
        clamp(
          12px,
          4vh,
          25px
        );

      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(
          350px,
          calc(100% - 20px)
        );

      z-index: 20;

      display: flex;

      justify-content: center;

      align-items: center;

      pointer-events: none;

      user-select: none;
    }


    .song-title img {

      display: block;

      width: 100%;

      height: auto;

      object-fit: contain;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================
       SONG AREA
    ========================== */

    .song-area {

      position: relative;

      width:
        min(
          390px,
          100%
        );

      height:
        min(
          520px,
          55vh
        );

      display: flex;

      justify-content: center;

      align-items: center;

      margin-top: 30px;
    }


    /* =========================
       SONG PLAYER
    ========================== */

    .song-player {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 100%;
      height: 100%;

      object-fit: contain;

      transform:
        translate(
          -50%,
          -50%
        );

      pointer-events: none;

      user-select: none;

      z-index: 2;
    }


    /* =========================
       VINYL WRAPPER
    ========================== */

    .vinyl-wrap {

      position: absolute;

      left: 50%;
      top: 50%;

      width: 100%;
      height: 100%;

      transform:
        translate(
          -50%,
          -50%
        );

      z-index: 3;

      pointer-events: none;

      user-select: none;
    }


    /* =========================
       VINYL
    ========================== */

    .vinyl {

      position: absolute;

      left: 0;
      top: 0;

      width: 100%;
      height: 100%;

      object-fit: contain;

      pointer-events: none;

      user-select: none;

      opacity: 1;

      transform-origin:
        40.2% 56.2%;

      transform:
        rotate(0deg);

      will-change: transform;
    }


    /* =========================
       VINYL SPIN
    ========================== */

    .vinyl.spin {

      animation:
        vinylSpin
        5s
        linear
        infinite;
    }


    @keyframes vinylSpin {

      from {
        transform:
          rotate(0deg);
      }

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =========================
       MUSIC NOTES
    ========================== */

    .music-note {

      position: absolute;

      width:
        clamp(
          65px,
          18vw,
          90px
        );

      height:
        clamp(
          65px,
          18vw,
          90px
        );

      object-fit: contain;

      pointer-events: none;

      user-select: none;

      opacity: 0;

      z-index: 5;
    }


    /* =========================
       NOTE 1
    ========================== */

    #note1 {

      left: 25%;
      top: 55%;
    }


    /* =========================
       NOTE 2
    ========================== */

    #note2 {

      left: 55%;
      top: 58%;
    }


    /* =========================
       NOTE 3
    ========================== */

    #note3 {

      left: 42%;
      top: 65%;
    }


    /* =========================
       NOTE SHOW
    ========================== */

    .music-note.show {

      animation:
        noteFloat
        5s
        ease-in-out
        infinite;
    }


    @keyframes noteFloat {

      0% {

        opacity: 0;

        transform:
          translateY(30px)
          rotate(-5deg)
          scale(.8);
      }


      20% {

        opacity: 1;
      }


      50% {

        opacity: .9;

        transform:
          translateY(-70px)
          rotate(5deg)
          scale(1);
      }


      80% {

        opacity: .7;

        transform:
          translateY(-150px)
          rotate(-5deg)
          scale(.95);
      }


      100% {

        opacity: 0;

        transform:
          translateY(-220px)
          rotate(8deg)
          scale(.85);
      }

    }


    /* =========================
       NOTE DELAY
    ========================== */

    #note1.show {

      animation-delay:
        0s;
    }


    #note2.show {

      animation-delay:
        1.2s;
    }


    #note3.show {

      animation-delay:
        2.4s;
    }


    /* =====================================================
       BUTTON AREA
    ===================================================== */

    .button-area {

      position: relative;

      width: 100%;

      height: 70px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap:
        clamp(
          6px,
          2vw,
          12px
        );

      margin-top: 10px;

      flex-shrink: 0;
    }


    /* =====================================================
       IMAGE BUTTON
    ===================================================== */

    .btn {

      display: block;

      width: 145px;

      height: auto;

      padding: 0;

      margin: 0;

      border: none;

      border-radius: 0;

      background: transparent;

      box-shadow: none;

      cursor: pointer;

      line-height: 0;

      text-decoration: none;

      user-select: none;

      -webkit-user-drag: none;

      transition:
        transform .2s ease,
        opacity .4s ease;
    }


    .btn img {

      display: block;

      width: 100%;

      height: auto;

      border: none;

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;
    }


    .btn:hover {

      transform:
        translateY(-2px)
        scale(1.03);
    }


    .btn:active {

      transform:
        scale(.95);
    }


    /* =====================================================
       PLAY BUTTON
    ===================================================== */

    #playVinylBtn {

      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      opacity: 1;

      pointer-events: auto;

      z-index: 10;
    }


    #playVinylBtn:hover {

      transform:
        translateX(-50%)
        translateY(-2px)
        scale(1.03);
    }


    #playVinylBtn:active {

      transform:
        translateX(-50%)
        scale(.95);
    }


    /* =====================================================
       HIDE PLAY
    ===================================================== */

    #playVinylBtn.hide {

      opacity: 0;

      pointer-events: none;
    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    #backBtn {

      position: static;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(10px);
    }


    #backBtn.show {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateY(0);

      animation:
        buttonAppear
        .6s
        ease
        forwards;
    }


    /* =====================================================
       NEXT BUTTON
    ===================================================== */

    #nextBtn {

      position: static;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(10px);
    }


    #nextBtn.show {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateY(0);

      animation:
        buttonAppear
        .6s
        ease
        forwards;
    }


    /* =====================================================
       BUTTON APPEAR
    ===================================================== */

    @keyframes buttonAppear {

      0% {

        opacity: 0;

        transform:
          translateY(12px)
          scale(.95);
      }


      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =========================
       HIDDEN AUDIO
    ========================== */

    #songVideo {

      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;

      pointer-events: none;
    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 500px) {

      .song-container {

        width: 100vw;

        height: 100vh;

        padding:
          65px 10px
          80px;
      }


      .song-title {

        top: 10px;

        width:
          min(
            350px,
            calc(100% - 15px)
          );
      }


      .song-area {

        width:
          min(
            92vw,
            390px
          );

        height:
          min(
            112vw,
            480px
          );

        margin-top: 20px;
      }


      .button-area {

        margin-top: 5px;

        gap: 8px;
      }


      .btn {

        width:
          calc(
            (100vw - 28px) / 2
          );

        max-width: 145px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ====================================================== */

    @media (max-width: 380px) {

      .song-container {

        padding:
          58px 8px
          75px;
      }


      .song-title {

        top: 5px;

        width:
          min(
            330px,
            calc(100% - 15px)
          );
      }


      .song-area {

        width: 94vw;

        height:
          min(
            108vw,
            430px
          );

        margin-top: 15px;
      }


      .music-note {

        width: 65px;

        height: 65px;
      }


      .button-area {

        gap: 6px;

        margin-top: 3px;
      }


      .btn {

        width:
          calc(
            (100vw - 22px) / 2
          );

        max-width: 135px;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
    ====================================================== */

    @media (max-width: 340px) {

      .song-title {

        width:
          min(
            310px,
            calc(100% - 10px)
          );
      }


      .song-area {

        height: 390px;

        margin-top: 8px;
      }


      .music-note {

        width: 58px;

        height: 58px;
      }


      .btn {

        width: 128px;
      }

    }


    /* =====================================================
       SHORT SCREEN
    ====================================================== */

    @media (max-height: 700px) {

      .song-container {

        padding:
          55px 12px
          70px;
      }


      .song-title {

        top: 5px;
      }


      .song-area {

        height:
          min(
            53vh,
            390px
          );

        margin-top: 12px;
      }


      .button-area {

        margin-top: 5px;
      }

    }


    /* =====================================================
       VERY SHORT SCREEN
    ====================================================== */

    @media (max-height: 600px) {

      .song-container {

        padding:
          40px 10px
          60px;
      }


      .song-title {

        top: 2px;
      }


      .song-area {

        height:
          min(
            48vh,
            300px
          );

        margin-top: 5px;
      }


      .button-area {

        height: 55px;

        margin-top: 2px;
      }


      .btn {

        width: 125px;
      }

    }


    /* =====================================================
       TABLET
    ====================================================== */

    @media
      (min-width: 501px)
      and (max-width: 900px)
      and (min-height: 601px) {

      .song-container {

        width:
          min(
            435px,
            88vw
          );

        height:
          min(
            700px,
            94vh
          );
      }


      .song-area {

        width:
          min(
            390px,
            82vw
          );

        height:
          min(
            520px,
            52vh
          );
      }

    }


    /* =====================================================
       TABLET LANDSCAPE
    ====================================================== */

    @media
      (min-width: 700px)
      and (max-height: 600px) {

      .song-container {

        width: 435px;

        height: 100vh;

        padding:
          40px 15px
          55px;
      }


      .song-title {

        top: 3px;

        width: 300px;
      }


      .song-area {

        width: 350px;

        height: 300px;

        margin-top: 5px;
      }


      .button-area {

        height: 55px;

        margin-top: 0;
      }


      .btn {

        width: 145px;
      }

    }


    /* =====================================================
       LARGE DESKTOP
    ====================================================== */

    @media (min-width: 1200px) {

      .song-container {

        width: 435px;

        height: 700px;
      }


      .song-title {

        width: 350px;
      }


      .song-area {

        width: 390px;

        height: 520px;
      }


      .button-area {

        margin-top: 5px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="song-container">


    <!-- =========================
         SONG TITLE IMAGE
    ========================== -->

    <div class="song-title">

      <img
        src="text2.png"
        alt=""
        draggable="false"
      >

    </div>


    <!-- =========================
         SONG AREA
    ========================== -->

    <div class="song-area">


      <!-- SONG PLAYER -->

      <img
        class="song-player"
        src="song1.png"
        draggable="false"
        alt=""
      >


      <!-- VINYL -->

      <div class="vinyl-wrap">

        <img
          class="vinyl"
          id="vinyl"
          src="song2.png"
          draggable="false"
          alt=""
        >

      </div>


      <!-- MUSIC NOTES -->

      <img
        class="music-note"
        id="note1"
        src="not1.png"
        draggable="false"
        alt=""
      >


      <img
        class="music-note"
        id="note2"
        src="not2.png"
        draggable="false"
        alt=""
      >


      <img
        class="music-note"
        id="note3"
        src="not3.png"
        draggable="false"
        alt=""
      >

    </div>


    <!-- =========================
         BUTTON AREA
    ========================== -->

    <div class="button-area">


      <!-- PLAY -->

      <button
        class="btn"
        id="playVinylBtn"
        aria-label="เล่นเพลง"
      >

        <img
          src="play.png"
          alt="เล่นเพลง"
          draggable="false"
        >

      </button>


      <!-- BACK -->

      <button
        class="btn"
        id="backBtn"
        aria-label="ย้อนกลับ"
      >

        <img
          src="back.png"
          alt="ย้อนกลับ"
          draggable="false"
        >

      </button>


      <!-- NEXT -->

      <button
        class="btn"
        id="nextBtn"
        aria-label="ถัดไป"
      >

        <img
          src="next.png"
          alt="ถัดไป"
          draggable="false"
        >

      </button>


    </div>


  </main>


  <!-- =========================
       MUSIC
  ========================== -->

  <video
    id="songVideo"
    src="song.mp3"
    preload="auto"
    playsinline
  ></video>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    /* =========================
       GET ELEMENTS
    ========================== */

    const vinyl =
      document.getElementById(
        "vinyl"
      );


    const note1 =
      document.getElementById(
        "note1"
      );


    const note2 =
      document.getElementById(
        "note2"
      );


    const note3 =
      document.getElementById(
        "note3"
      );


    const playVinylBtn =
      document.getElementById(
        "playVinylBtn"
      );


    const backBtn =
      document.getElementById(
        "backBtn"
      );


    const nextBtn =
      document.getElementById(
        "nextBtn"
      );


    const songVideo =
      document.getElementById(
        "songVideo"
      );


    /* =========================
       STATE
    ========================== */

    let musicStarted = false;


    /* =========================
       PLAY MUSIC
    ========================== */

    playVinylBtn.addEventListener(
      "click",
      function () {

        if (musicStarted) return;

        musicStarted = true;


        /* PLAY SONG */

        songVideo.currentTime = 0;

        songVideo.play()
          .catch(
            function (error) {

              console.log(
                "ไม่สามารถเล่นเพลง:",
                error
              );

            }
          );


        /* START VINYL */

        vinyl.classList.add(
          "spin"
        );


        /* HIDE PLAY */

        playVinylBtn.classList.add(
          "hide"
        );


        /* MUSIC NOTES */

        note1.classList.add(
          "show"
        );


        setTimeout(
          function () {

            note2.classList.add(
              "show"
            );

          },
          700
        );


        setTimeout(
          function () {

            note3.classList.add(
              "show"
            );

          },
          1400
        );


        /* SHOW BACK + NEXT */

        setTimeout(
          function () {

            backBtn.classList.add(
              "show"
            );

            nextBtn.classList.add(
              "show"
            );

          },
          1000
        );

      }
    );


    /* =========================
       BACK
    ========================== */

    backBtn.addEventListener(
      "click",
      function () {

        window.location.href =
          "day.html";

      }
    );


    /* =========================
       NEXT
    ========================== */

    nextBtn.addEventListener(
      "click",
      function () {

        window.location.href =
          "pic.html";

      }
    );

  </script>


</body>

</html>
