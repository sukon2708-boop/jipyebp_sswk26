<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover"

>

  <title>Letter</title>

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {
      font-family: "Prompt", sans-serif;

      background:
        url("bg.png")
        center center /
        cover
        no-repeat;

      display: flex;

      justify-content: center;
      align-items: center;

      min-height: 100svh;
    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .letter-container {
      position: relative;

      width: min(100vw, 600px);
      height: 100svh;

      display: flex;

      flex-direction: column;

      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        15px
        max(20px, env(safe-area-inset-bottom));
    }


    /* =====================================================
       LETTER BOX
    ===================================================== */

    .letter-box {
      position: relative;

      width: min(390px, 88vw);

      aspect-ratio: 390 / 520;

      height: auto;

      perspective: 1200px;

      flex-shrink: 0;
    }


    /* =====================================================
       LETTER IMAGE
    ===================================================== */

    .letter-layer {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 100%;
      height: 100%;

      object-fit: contain;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

      user-select: none;

      -webkit-user-drag: none;

      transition:
        opacity .5s ease,
        transform .8s cubic-bezier(.22,.61,.36,1);
    }


    /* =====================================================
       LETTER 1
    ===================================================== */

    #letter {
      z-index: 1;

      opacity: 1;

      transform:
        translate(-50%, -50%)
        scale(1);

      /* เพิ่มให้ letter.png สามารถกดได้ */
      pointer-events: auto;

      cursor: pointer;
    }


    /* =====================================================
       LETTER 2
    ===================================================== */

    #letter2 {
      z-index: 2;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    /* =====================================================
       LETTER 4
    ===================================================== */

    #letter4 {
      z-index: 3;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        translateY(25px)
        scale(1);

      /* สามารถกดเพื่ออ่านข้อความ */
      pointer-events: none;

      cursor: pointer;
    }


    /* =====================================================
       LETTER 3
    ===================================================== */

    #letter3 {
      z-index: 4;

      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(1);
    }


    /* =====================================================
       OPENED
    ===================================================== */

    .letter-box.opened #letter {
      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(.96);

      pointer-events: none;
    }


    /* =====================================================
       LETTER 2 APPEAR
    ===================================================== */

    .letter-box.opened #letter2 {
      opacity: 1;
    }


    /* =====================================================
       LETTER 4 APPEAR
    ===================================================== */

    .letter-box.opened #letter4 {
      opacity: 1;

      animation:
        paperUp
        1.4s
        cubic-bezier(.22,.61,.36,1)
        1s
        forwards;

      pointer-events: auto;
    }


    /* =====================================================
       LETTER 3 APPEAR
    ===================================================== */

    .letter-box.opened #letter3 {
      opacity: 1;
    }


    /* =====================================================
       PAPER UP
    ===================================================== */

    @keyframes paperUp {

      0% {

        transform:
          translate(-50%, -50%)
          translateY(25px)
          scale(1);
      }

      100% {

        transform:
          translate(-50%, -50%)
          translateY(-145px)
          scale(1);
      }

    }


    /* =====================================================
       READ LETTER
       กด letter4 เพื่อขยายเต็มหน้าจอ
    ===================================================== */

.letter-box.reading #letter4 {

  position: fixed;

  left: 50%;
  top: 50%;

  width: auto;
  height: auto;

  max-width: 90vw;
  max-height: 82vh;

  object-fit: contain;

  transform:
    translate(-50%, -50%)
    scale(1);

  opacity: 1;

  z-index: 100;

  animation: none;

  cursor: pointer;

  pointer-events: auto;

  transition:
    opacity .6s ease,
    transform .6s cubic-bezier(.22,.61,.36,1);
}

    /* =====================================================
       BUTTON AREA
       ตำแหน่งเดียวกับหน้า day.html
       bottom: 50px
    ===================================================== */

    .button-area {

      position: fixed;

      left: 50%;

      bottom: 50px;

      transform:
        translateX(-50%);

      width: max-content;

      height: 54px;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 12px;

      z-index: 40;
    }


    /* =====================================================
       IMAGE BUTTON
    ===================================================== */

    #openBtn,
    #backBtn,
    #nextBtn {

      display: block;

      width: 145px;

      height: auto;

      padding: 0;

      margin: 0;

      border: none;

      border-radius: 0;

      background: none;

      box-shadow: none;

      cursor: pointer;

      user-select: none;

      -webkit-user-drag: none;

      transition:
        transform .2s ease,
        opacity .4s ease;
    }


    /* =====================================================
       OPEN BUTTON
       ใช้ตำแหน่งเดิมของคุณ
    ===================================================== */

    #openBtn {

      position: absolute;

      left: 50%;

      top: calc(230% - 80px);

      transform:
        translate(-50%, -50%);

      opacity: 1;

      pointer-events: auto;
    }


    #openBtn:hover {

      transform:
        translate(-50%, -50%)
        scale(1.05);
    }


    #openBtn:active {

      transform:
        translate(-50%, -50%)
        scale(.95);
    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    #backBtn {

      position: relative;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(10px);
    }


    #backBtn.show {

      opacity: 1;

      pointer-events: auto;

      animation:
        backAppear
        .6s
        ease
        forwards;
    }


    #backBtn:hover {

      transform:
        translateY(-2px)
        scale(1.05);
    }


    #backBtn:active {

      transform:
        translateY(0)
        scale(.95);
    }


    /* =====================================================
       NEXT BUTTON
    ===================================================== */

    #nextBtn {

      position: relative;

      opacity: 0;

      pointer-events: none;

      transform:
        translateY(10px);
    }


    #nextBtn.show {

      opacity: 1;

      pointer-events: auto;

      animation:
        nextAppear
        .6s
        ease
        forwards;
    }


    #nextBtn:hover {

      transform:
        translateY(-2px)
        scale(1.05);
    }


    #nextBtn:active {

      transform:
        translateY(0)
        scale(.95);
    }


    /* =====================================================
       BACK ANIMATION
    ===================================================== */

    @keyframes backAppear {

      0% {

        opacity: 0;

        transform:
          translateY(12px)
          scale(.95);
      }

      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       NEXT ANIMATION
    ===================================================== */

    @keyframes nextAppear {

      0% {

        opacity: 0;

        transform:
          translateY(12px)
          scale(.95);
      }

      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 500px) {

      .letter-container {

        width: 100vw;

        padding-left: 10px;

        padding-right: 10px;
      }


      .letter-box {

        width:
          min(
            92vw,
            390px
          );
      }


      /* ปุ่มตำแหน่งเดียวกับ day.html */

      .button-area {

        bottom: 50px;

        gap: 8px;
      }


      #openBtn,
      #backBtn,
      #nextBtn {

        width: 145px;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 380px) {

      .letter-box {

        width: 94vw;
      }


      .button-area {

        bottom: 50px;

        gap: 6px;
      }


      #openBtn,
      #backBtn,
      #nextBtn {

        width: 135px;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
    ===================================================== */

    @media (max-width: 340px) {

      .letter-box {

        width: 92vw;
      }


      .button-area {

        bottom: 50px;

        gap: 5px;
      }


      #openBtn,
      #backBtn,
      #nextBtn {

        width: 128px;
      }

    }


    /* =====================================================
       TABLET / IPAD
    ===================================================== */

    @media
      (min-width: 501px)
      and (max-width: 1024px) {

      .letter-box {

        width:
          min(
            390px,
            58vw
          );
      }


      .button-area {

        bottom: 50px;

        gap: 10px;
      }


      #openBtn,
      #backBtn,
      #nextBtn {

        width: 150px;
      }

    }


    /* =====================================================
       IPAD PORTRAIT
    ===================================================== */

    @media
      (min-width: 501px)
      and (max-width: 1024px)
      and (orientation: portrait) {

      .letter-box {

        width:
          min(
            390px,
            65vw
          );
      }


      .button-area {

        bottom: 50px;
      }

    }


    /* =====================================================
       IPAD LANDSCAPE
    ===================================================== */

    @media
      (min-width: 501px)
      and (max-width: 1024px)
      and (orientation: landscape) {

      .letter-box {

        width:
          min(
            340px,
            43vw
          );
      }


      .button-area {

        bottom: 50px;
      }

    }


    /* =====================================================
       SHORT SCREEN
    ===================================================== */

    @media (max-height: 700px) {

      .letter-box {

        width:
          min(
            350px,
            72vw
          );
      }


      .button-area {

        bottom: 50px;
      }

    }


    /* =====================================================
       SHORT MOBILE
    ===================================================== */

    @media
      (max-width: 500px)
      and (max-height: 700px) {

      .letter-box {

        width:
          min(
            340px,
            80vw
          );
      }


      .button-area {

        bottom: 50px;
      }

    }


    /* =====================================================
       VERY SHORT SCREEN
    ===================================================== */

    @media (max-height: 600px) {

      .letter-box {

        width:
          min(
            300px,
            65vw
          );
      }


      .button-area {

        bottom: 50px;
      }

    }


    /* =====================================================
       LARGE DESKTOP
    ===================================================== */

    @media (min-width: 1200px) {

      .letter-box {

        width: 390px;
      }


      .button-area {

        bottom: 50px;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main class="letter-container">


<!-- ===================================================
     LETTER BOX
=================================================== -->

<div
  class="letter-box"
  id="letterBox"
>


  <!-- LETTER BEFORE OPEN -->

  <img
    id="letter"
    class="letter-layer"
    src="letter.png"
    draggable="false"
    alt=""
  >


  <!-- LETTER OPENED -->

  <img
    id="letter2"
    class="letter-layer"
    src="letter2.png"
    draggable="false"
    alt=""
  >


  <!-- PAPER -->

  <img
    id="letter4"
    class="letter-layer"
    src="letter4.png"
    draggable="false"
    alt=""
  >


  <!-- FRONT LAYER -->

  <img
    id="letter3"
    class="letter-layer"
    src="letter3.png"
    draggable="false"
    alt=""
  >

</div>


<!-- ===================================================
     IMAGE BUTTON AREA
===================================================== -->

<div class="button-area">


  <!-- OPEN -->

  <img
    id="openBtn"
    src="open.png"
    draggable="false"
    alt=""
  >


  <!-- BACK -->

  <img
    id="backBtn"
    src="back.png"
    draggable="false"
    alt=""
  >


  <!-- NEXT -->

  <img
    id="nextBtn"
    src="next.png"
    draggable="false"
    alt=""
  >

</div>


  </main>

  <script>


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const letterBox =
      document.getElementById("letterBox");

    const letter =
      document.getElementById("letter");

    const letter4 =
      document.getElementById("letter4");

    const openBtn =
      document.getElementById("openBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const backBtn =
      document.getElementById("backBtn");


    /* =====================================================
       STATE
    ===================================================== */

    let opened = false;

    let reading = false;


    /* =====================================================
       OPEN LETTER
       ใช้ร่วมกันทั้ง open.png และ letter.png
    ===================================================== */

    function openLetter() {

      /* ป้องกันกดซ้ำ */

      if (opened) {
        return;
      }


      opened = true;


      /* เปิดจดหมาย */

      letterBox.classList.add("opened");


      /* ซ่อนปุ่มเปิด */

      openBtn.style.opacity = "0";

      openBtn.style.pointerEvents = "none";


      /* รอ Animation */

      setTimeout(
        function () {


          /* ซ่อน Open */

          openBtn.style.display = "none";


          /* แสดง Back */

          backBtn.classList.add("show");


          /* แสดง Next */

          nextBtn.classList.add("show");


        },
        2600
      );

    }


    /* =====================================================
       OPEN BUTTON
    ===================================================== */

    openBtn.addEventListener(
      "click",
      function () {

        openLetter();

      }
    );


    /* =====================================================
       CLICK LETTER.PNG
       กดรูปจดหมายเพื่อเปิดได้เหมือน open.png
    ===================================================== */

    letter.addEventListener(
      "click",
      function () {

        openLetter();

      }
    );


    /* =====================================================
       READ LETTER
       หลังเปิดเสร็จ กด letter4 เพื่ออ่านข้อความ
    ===================================================== */

    letter4.addEventListener(
      "click",
      function () {

        /* ต้องเปิดจดหมายก่อน */

        if (!opened) {
          return;
        }


        /* ป้องกันกดซ้ำ */

        if (reading) {
          return;
        }


        reading = true;


        /* แสดง letter4 แบบเต็มหน้าจอ */

        letterBox.classList.add("reading");

      }
    );


    /* =====================================================
       NEXT
    ===================================================== */

    nextBtn.addEventListener(
      "click",
      function () {

        window.location.href =
          "day.html";

      }
    );


    /* =====================================================
       BACK
    ===================================================== */

    backBtn.addEventListener(
      "click",
      function () {

        window.location.href =
          "index.html";

      }
    );


  </script>

</body>

</html>
